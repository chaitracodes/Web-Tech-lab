<!Doctype html>
<html>
<head>
<title> Student feedback form </title>
<style>
form{
    border: 2px solid black;
    width: 300px;
    padding: 20px;
    margin: auto;
}
</style>
</head>
<body>
    <center >
    <h1>Student Feedback Form</h1>
        <br><br>
<form>
Name: <input type="text" name="name"> <br><br>
USN: <input type="text" name="usn"> <br><br>
Gender:
<input type="radio" value="g">male
<input type="radio" value="g">female <br><br>
course review:
<select>
<option>best</option>
<option>good</option>
<option>average</option> 
</select>
<br><br>
Feedback:<br>
<textarea rows="4" col="30" ></textarea>
<br><br>
<input type="submit" value="submit">
<input type="reset" value="reset">
</form>
</center>
</body>
</html>
